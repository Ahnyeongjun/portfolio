  <line x1="110" y1="57" x2="136" y2="57" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <line x1="240" y1="57" x2="266" y2="57" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <line x1="400" y1="57" x2="426" y2="57" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrowr)"/>

  <line x1="20" y1="106" x2="620" y2="106" stroke="#e9ebee"/>

  <text x="20" y="134" font-size="12" font-weight="700" fill="#3366ff" letter-spacing="0.04em">TO-BE</text>
  <text x="620" y="134" text-anchor="end" font-size="10.5" fill="#3366ff">Git ⇄ 클러스터 지속 동기화(reconcile loop)</text>

  <g fill="#1a1a1e">
    <rect x="20" y="144" width="88" height="46" rx="10" fill="#f6f7f9" stroke="#c7cbd1"/>
