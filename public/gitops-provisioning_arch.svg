    <text x="191" y="180" text-anchor="middle" font-size="8.5" fill="#4a4f57">배포 상태 선언</text>

    <rect x="274" y="144" width="110" height="46" rx="10" fill="#f6f7f9" stroke="#c7cbd1"/>
