<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Pretendard, -apple-system, sans-serif">
  <defs>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9302c"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3366ff"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#ffffff"/>

  <text x="20" y="24" font-size="12" font-weight="700" fill="#c9302c" letter-spacing="0.04em">AS-IS</text>
  <text x="620" y="24" text-anchor="end" font-size="10.5" fill="#c9302c">실행 후 상태 기록 없음 · 되돌릴 지점 없음</text>

  <g fill="#1a1a1e">
    <rect x="20" y="34" width="90" height="46" rx="10" fill="#f6f7f9" stroke="#c7cbd1"/>
    <text x="65" y="61" text-anchor="middle" font-size="11" font-weight="700">개발자</text>

    <rect x="140" y="34" width="100" height="46" rx="10" fill="#f6f7f9" stroke="#c7cbd1"/>
    <text x="190" y="61" text-anchor="middle" font-size="11" font-weight="700">Jenkins</text>

    <rect x="270" y="34" width="130" height="46" rx="10" fill="#fdeeee" stroke="#c9302c"/>
    <text x="335" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#c9302c">kubectl apply</text>

    <rect x="430" y="34" width="100" height="46" rx="10" fill="#f6f7f9" stroke="#c7cbd1"/>
    <text x="480" y="61" text-anchor="middle" font-size="11" font-weight="700">클러스터</text>
