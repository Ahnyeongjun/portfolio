    <text x="586" y="171" text-anchor="middle" font-size="10.5" font-weight="700">Pulp</text>
  </g>
  <line x1="108" y1="167" x2="132" y2="167" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <line x1="246" y1="167" x2="270" y2="167" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <line x1="384" y1="167" x2="408" y2="167" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <line x1="532" y1="167" x2="546" y2="167" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <path d="M586,190 L586,230 L472,230 L472,236" fill="none" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <g fill="#1a1a1e">
    <rect x="352" y="238" width="120" height="52" rx="10" fill="#eaf0ff" stroke="#3366ff"/>
    <text x="412" y="260" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3366ff">ArgoCD</text>
    <text x="412" y="277" text-anchor="middle" font-size="8.5" fill="#4a4f57">선언 상태 관리</text>

    <rect x="500" y="238" width="120" height="52" rx="10" fill="#eaf0ff" stroke="#3366ff"/>
    <text x="560" y="260" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3366ff">클러스터</text>
    <text x="560" y="277" text-anchor="middle" font-size="8.5" fill="#4a4f57">실제 상태</text>
  </g>
  <line x1="472" y1="255" x2="496" y2="255" stroke="#3366ff" stroke-width="1.5" marker-end="url(#arrowb)"/>
  <line x1="496" y1="273" x2="472" y2="273" stroke="#3366ff" stroke-width="1.5" marker-end="url(#arrowb)"/>
  <text x="484" y="248" text-anchor="middle" font-size="7.5" fill="#3366ff">sync</text>
  <text x="484" y="288" text-anchor="middle" font-size="7.5" fill="#3366ff">drift 감지</text>

  <path d="M412,238 L412,220 L191,220 L191,194" fill="none" stroke="#3366ff" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowb)"/>
  <text x="300" y="216" text-anchor="middle" font-size="9" fill="#3366ff">클러스터 상태가 Git 선언과 어긋나면 계속 재동기화</text>

  <line x1="20" y1="308" x2="620" y2="308" stroke="#e9ebee"/>
  <text x="320" y="326" text-anchor="middle" font-size="10.5" fill="#8b9099">이 표준은 NIPA · KARI · 국가보안기관 등 서로 다른 온프레미스 클러스터에 동일하게 적용했습니다</text>
