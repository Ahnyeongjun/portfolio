    <text x="915" y="92" text-anchor="middle" font-size="10.5" fill="#4a4f57">GDAL 기반</text>
  </g>

  <!-- monitoring -->
  <g font-size="12" fill="#1a1a1e">
    <line x1="305" y1="128" x2="305" y2="150" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <rect x="210" y="152" width="190" height="40" rx="10" fill="#f6f7f9" stroke="#e0e2e6"/>
