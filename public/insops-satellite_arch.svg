    <text x="259" y="348" text-anchor="middle" font-size="11.5" fill="#4a4f57">kubeadm 직접 구성</text>
    <text x="259" y="366" text-anchor="middle" font-size="11" fill="#8b9099">롤링 무중단 배포</text>

    <line x1="332" y1="340" x2="354" y2="340" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow3)"/>

    <rect x="356" y="302" width="176" height="76" rx="10" fill="#f6f7f9" stroke="#c7cbd1"/>
    <text x="444" y="328" text-anchor="middle" font-weight="700" font-size="13">다종 수집기 통합</text>
    <text x="444" y="348" text-anchor="middle" font-size="11.5" fill="#4a4f57">DB 기반 중복 체크</text>
    <text x="444" y="366" text-anchor="middle" font-size="11" fill="#8b9099">zst/tar.gz 변환 자동화</text>

    <line x1="532" y1="340" x2="554" y2="340" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow3)"/>

    <rect x="556" y="296" width="230" height="88" rx="10" fill="#eaf0ff" stroke="#3366ff"/>
    <text x="671" y="318" text-anchor="middle" font-weight="700" font-size="13" fill="#3366ff">Go 서비스 계층</text>
    <text x="671" y="338" text-anchor="middle" font-size="11" fill="#4a4f57">DB 접근 중앙화 API - 스키마 변경 1곳</text>
