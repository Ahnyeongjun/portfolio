  <!-- ============ Lane 1: 판독·운영 시스템 ============ -->
  <text x="30" y="56" font-size="13" font-weight="700" fill="#3366ff" letter-spacing="0.02em">판독·운영 시스템 (2022.05~) · Spring Boot + jQuery/JSP 멀티모듈</text>

  <g fill="#1a1a1e">
