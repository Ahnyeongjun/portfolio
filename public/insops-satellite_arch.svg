  </g>

  <!-- outside airgap: viewer -->
  <g font-size="12" fill="#1a1a1e">
    <line x1="740" y1="128" x2="740" y2="230" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <rect x="630" y="232" width="220" height="60" rx="10" fill="#eaf0ff" stroke="#3366ff"/>
