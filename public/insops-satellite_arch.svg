    <text x="671" y="372" text-anchor="middle" font-size="10.5" fill="#8b9099">CPU 코어 기반 세마포어 · TTL 캐시</text>

    <line x1="786" y1="340" x2="808" y2="340" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow3)"/>

    <rect x="810" y="302" width="160" height="76" rx="10" fill="#f6f7f9" stroke="#c7cbd1"/>
    <text x="890" y="328" text-anchor="middle" font-weight="700" font-size="13">PostgreSQL</text>
    <text x="890" y="348" text-anchor="middle" font-size="11.5" fill="#4a4f57">GDAL 기반 영상 메타</text>
    <text x="890" y="366" text-anchor="middle" font-size="10.5" fill="#8b9099">서비스는 HTTP로만 접근</text>
