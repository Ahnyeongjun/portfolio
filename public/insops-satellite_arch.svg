  <g font-size="11.5" fill="#8b9099">
    <text x="30" y="418">Spring Session + Redis 세션 외부화 · 인증(Filter) + 인가(AOP) 분리 · 47개 매퍼 SQL Injection 해소 · Zabbix 장애 사전 감지</text>
