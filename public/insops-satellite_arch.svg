  </defs>
  <rect width="1000" height="450" fill="#ffffff"/>

  <!-- air-gap boundary -->
  <rect x="10" y="34" width="980" height="352" rx="14" fill="none" stroke="#c7cbd1" stroke-dasharray="6 5"/>
