    <text x="100" y="92" text-anchor="middle" font-size="11" fill="#4a4f57">베어메탈 신규 구축</text>

    <line x1="170" y1="80" x2="208" y2="80" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow3)"/>

    <rect x="210" y="32" width="190" height="96" rx="10" fill="#eaf0ff" stroke="#3366ff"/>
    <text x="305" y="60" text-anchor="middle" font-weight="700" fill="#3366ff">K8s 클러스터</text>
    <text x="305" y="80" text-anchor="middle" font-size="11" fill="#4a4f57">수십 대 서버 규모</text>
    <text x="305" y="98" text-anchor="middle" font-size="10.5" fill="#8b9099">롤링 방식 무중단 운영</text>

    <line x1="400" y1="80" x2="438" y2="80" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow3)"/>

    <rect x="440" y="32" width="180" height="96" rx="10" fill="#f6f7f9" stroke="#c7cbd1"/>
    <text x="530" y="58" text-anchor="middle" font-weight="700">다종 수집기 통합</text>
    <text x="530" y="78" text-anchor="middle" font-size="11" fill="#4a4f57">중복 체크 · 포맷 변환</text>
    <text x="530" y="96" text-anchor="middle" font-size="10.5" fill="#8b9099">zst/tar.gz 자동화</text>

    <line x1="620" y1="80" x2="658" y2="80" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow3)"/>

    <rect x="660" y="32" width="160" height="96" rx="10" fill="#f6f7f9" stroke="#c7cbd1"/>
    <text x="740" y="60" text-anchor="middle" font-weight="700">Go API</text>
    <text x="740" y="80" text-anchor="middle" font-size="11" fill="#4a4f57">DB 접근 중앙화</text>
    <text x="740" y="98" text-anchor="middle" font-size="10.5" fill="#8b9099">스키마 변경 영향 1곳</text>

    <line x1="820" y1="80" x2="858" y2="80" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow3)"/>

    <rect x="860" y="44" width="110" height="72" rx="10" fill="#f6f7f9" stroke="#c7cbd1"/>
